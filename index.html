<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제주 가족여행</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c2420;--mute:#6b746f;--line:#e4e0d6;--accent:#1f6f5b;--accent2:#e8f2ee;--warn:#b4571b;--warnbg:#fbeee3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121714;--card:#1b221e;--ink:#eef2ee;--mute:#98a39d;--line:#2b3430;--accent:#5cc2a4;--accent2:#1d3029;--warn:#f0a36b;--warnbg:#33241a}}
:root[data-theme="dark"]{--bg:#121714;--card:#1b221e;--ink:#eef2ee;--mute:#98a39d;--line:#2b3430;--accent:#5cc2a4;--accent2:#1d3029;--warn:#f0a36b;--warnbg:#33241a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{padding:28px 16px 12px;max-width:640px;margin:auto}
header small{color:var(--accent);font-weight:700;letter-spacing:.04em}
header h1{margin:4px 0 4px;font-size:26px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute);font-size:15.5px}
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 16px;max-width:640px;margin:auto;display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 4px;font:inherit;font-size:15px;cursor:pointer}
.tab b{display:block;font-size:16px}.tab span{font-size:12.5px;color:var(--mute)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}.tab.on span{color:#e6f5ef}
main{max-width:640px;margin:auto;padding:0 16px 40px}
.theme{margin:12px 0 10px;font-size:17px;color:var(--mute)}
.summary{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--accent2);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
#map{height:260px;border-radius:18px;border:1px solid var(--line);margin-bottom:16px;z-index:1}
.tl{position:relative;margin-left:8px}
.item{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line)}
.item:last-child{border-left-color:transparent}
.item::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.drive{font-size:14px;color:var(--mute);margin:-4px 0 10px;padding-left:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.time{font-size:14.5px;color:var(--accent);font-weight:700}
.card h3{margin:2px 0 6px;font-size:19px}
.card p{margin:0;font-size:15.5px;line-height:1.6;color:var(--mute)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:13px;border-radius:8px;padding:2px 8px;background:var(--accent2);color:var(--accent)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.res{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res label{font-size:13px;color:var(--mute);display:block}
.res input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:15.5px}
.links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:14.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.note{margin-top:8px;font-size:12px;color:var(--warn)}
footer{max-width:640px;margin:auto;padding:0 16px 32px;font-size:13.5px;color:var(--mute)}

.photos{display:flex;gap:8px;overflow-x:auto;margin:2px 0 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.photos figure{margin:0;flex:0 0 88%;scroll-snap-align:start}
.photos img{display:block;width:100%;height:170px;object-fit:cover;border-radius:12px;background:var(--accent2)}
.photos figcaption{font-size:12px;color:var(--mute);margin-top:3px}
.sec{margin:22px 0 8px;font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:15.5px;line-height:1.5}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.chk small{display:block;color:var(--mute);font-size:13.5px}
.alt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.alt b{display:block;font-size:16px}.alt span{color:var(--mute);font-size:14px}
.credits{font-size:13px;color:var(--mute);line-height:1.7}
.credits a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <small>JEJU · 2027.1.19–21</small>
  <h1>제주 가족여행 2박3일</h1>

</header>

<main id="main"></main>

 items:[

const $=s=>document.querySelector(s);
let cur=0,map,layer;
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 if(cur===DAYS.length){return renderPrep()}
 const D=DAYS[cur];
 $("#tabs").innerHTML=tabsHtml();
 $("#main").innerHTML=`<div class="theme">${D.theme}</div>
 <div class="summary"><span class="chip">도보 ${D.walk}</span><span class="chip">🏨 ${D.stay}</span><span class="chip">🚗 렌터카</span></div>
 <div id="map"></div><div class="tl">`+D.items.map(it=>{
  const dr=it.drive?`<div class="drive">🚗 ${it.drive}</div>`:"";
  const tags=(it.tags||[]).map(t=>`<span class="tag ${/확인|가정|대략/.test(t)?"warn":""}">${t}</span>`).join("");
  const res=(it.res||[]).map((r,i)=>`<div><label>${r}</label><input data-k="${it.id}-${i}" value="${esc(store.get(it.id+"-"+i))}" placeholder="입력"></div>`).join("");
  const links=(it.links||[]).map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("");
  const nav=`<a href="https://map.kakao.com/link/to/${encodeURIComponent(it.n)},${it.ll[0]},${it.ll[1]}" target="_blank" rel="noopener">길찾기 ↗</a>`;
  return `${dr}<div class="item"><div class="card"><div class="time">${it.t}</div><h3>${it.n}</h3>${photosHtml(it.id)}<p>${it.d}</p>
   ${tags?`<div class="meta">${tags}</div>`:""}${res?`<div class="res">${res}</div>`:""}<div class="links">${nav}${links}</div></div></div>`}).join("")+`</div>`;
 document.querySelectorAll(".res input").forEach(i=>i.oninput=()=>store.set(i.dataset.k,i.value));
 drawMap(D);window.scrollTo({top:0});
}
function drawMap(D){
 if(typeof L==="undefined"){$("#map").textContent="지도를 불러오지 못했습니다(인터넷 연결 확인).";return}
 map=L.map("map",{scrollWheelZoom:false});
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
 const pts=D.items.map(i=>i.ll);
 L.polyline(pts,{color:"#1f6f5b",weight:3,dashArray:"6 6"}).addTo(map);
 D.items.forEach((it,i)=>L.marker(it.ll,{icon:L.divIcon({className:"",html:`<div style="background:#1f6f5b;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:12px;font-weight:700;border:2px solid #fff">${i+1}</div>`,iconSize:[24,24]})}).addTo(map).bindPopup(`${it.t} ${it.n}`));
 map.fitBounds(pts,{padding:[24,24]});

function photosHtml(id){
 const ks=ITEM_PH[id]; if(!ks) return "";
 return '<div class="photos">'+ks.map(k=>'<figure><img loading="lazy" src="'+PH[k]+'" alt="'+PHM[k].cap+'"><figcaption>'+PHM[k].cap+' · '+PHM[k].by+' ('+PHM[k].lic+')</figcaption></figure>').join("")+'</div>';
}
function tabsHtml(){
 const t=DAYS.map(x=>[x.label,x.date]).concat([["준비","체크"]]);
 return t.map((x,i)=>'<button class="tab '+(i==cur?"on":"")+'" onclick="go('+i+')"><b>'+x[0]+'</b><span>'+x[1]+'</span></button>').join("");
}
function renderPrep(){
 $("#tabs").innerHTML=tabsHtml();
 const chk=CHECKS.map((c,i)=>{const on=store.get("chk-"+i)==="1";return '<label class="chk"><input type="checkbox" data-i="'+i+'" '+(on?"checked":"")+'><span>'+c[0]+'<small>'+c[1]+'</small></span></label>'}).join("");
 const alt=ALTS.map(a=>'<div class="alt"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>'+(a[2]?'<div class="photos" style="margin-top:-2px"><figure><img loading="lazy" src="'+PH[a[2]]+'" alt="'+PHM[a[2]].cap+'"><figcaption>'+PHM[a[2]].cap+' · '+PHM[a[2]].by+' ('+PHM[a[2]].lic+')</figcaption></figure></div>':'')).join("");
 const cr=Object.keys(PHM).map(k=>'<li>'+PHM[k].cap+' — '+PHM[k].by+', '+PHM[k].lic+' · <a href="'+PHM[k].url+'" target="_blank" rel="noopener">원본</a></li>').join("");
 $("#main").innerHTML='<div class="theme">출발 전 확인할 것과 예비 후보</div>'
  +'<h2 class="sec">출발 전 체크리스트</h2>'+chk
  +'<h2 class="sec">대안·예비 후보</h2>'+alt
  +'<h2 class="sec">날씨·시간 참고</h2><div class="alt"><span>맑음 가정 · 1월 일몰 약 17:50 · 겨울 아침 쌀쌀, 성산일출봉·섭지코지는 바람 강함(방한·바람막이) · 일정의 이동시간은 추정치</span></div>'
  +'<h2 class="sec">사진 출처</h2><ul class="credits">'+cr+'</ul>';
 document.querySelectorAll(".chk input").forEach(i=>i.onchange=()=>store.set("chk-"+i.dataset.i,i.checked?"1":"0"));
 window.scrollTo({top:0});
}
render();
